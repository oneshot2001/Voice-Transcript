<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/media-stream-player.min.js"></script>
</head>
<body>
<div class="d-flex" id="wrapper">
	<div class="bg-light border-right" id="sidebar-wrapper">
        <div class="sidebar-heading">&nbsp;</div>
		<div class="list-group list-group-flush">
			<a href="index.html" class="list-group-item list-group-item-action active">Video</a>
			<a href="config.html" class="list-group-item list-group-item-action">Config</a>
			<a href="events.html" class="list-group-item list-group-item-action">Events</a>
			<a href="about.html" class="list-group-item list-group-item-action">About</a>
		</div>
	</div>
	
	<div id="page-content-wrapper" class="p-0">

		<div class="container-fluid">
			<div class="col-12">
				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Live Video</h5>
					</div>
					<div class="card-body" id="settings-form">
						<div id="video-view">
							<div style="width:100%; height:100%; position:relative">
								<div id="video" style="width:100%; height:100%; position:absolute; top:0; left:0;"></div>
								<canvas id="canvas" width="1000" height="1000" style="width:100%; height:100%; position:absolute; top:0px; left:0px;"></canvas>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-12 mt-3">
				<div class="card">
					<div class="card-header">
						<h5 class="card-title mb-0">Audio Test</h5>
					</div>
					<div class="card-body">
						<p>Test the camera's microphone and speaker by recording 10 seconds of audio and playing it back.</p>
						<div class="btn-group" role="group">
							<button id="btn-record" class="btn btn-primary" onclick="recordAudio()">
								<i class="bi bi-mic-fill"></i> Record 10 Seconds
							</button>
							<button id="btn-playback" class="btn btn-success" onclick="playbackAudio()" disabled>
								<i class="bi bi-play-fill"></i> Playback
							</button>
						</div>
						<div class="mt-3">
							<strong>Status:</strong> <span id="audio-status" class="badge bg-secondary">Ready</span>
						</div>
						<div id="audio-message" class="alert mt-2" style="display:none;"></div>
					</div>
				</div>
			</div>
		</div>

	</div>
</div>
<script>
$(document).ready(function() {
	// Main AJAX call
	$.ajax({
		type: "GET",
		url: 'app',
		dataType: 'json',
		cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('.sidebar-heading').text(app.manifest.acapPackageConf.setup.friendlyName);
			const aspectRatio = app.device.aspect || '16:9';
			const [aspectWidth, aspectHeight] = aspectRatio.split(':').map(Number);
			const paddingPercentage = (aspectHeight / aspectWidth) * 100;

			$('.video-panel').css('padding-top', `${paddingPercentage}%`);
			PlayVideo(aspectRatio);
		},
        error: function(response) {
            alert(response.statusText);
        }
	});
});


function PlayVideo(aspect) {
	//TODO: Add support for portrait rotation
	var width = 800;
	var height = 450;
	switch (aspect) {
		case '4:3': width = 800; height = 600;break;
		case '1:1': width = 640; height = 640;break;
		case '16:10': width = 800; height = 500;break;
		default: width = 800; height = 450;break;
	}

	$("#video-view").css("width", width + "px");
	$("#video-view").css("height", height + "px");

	var secureConnection = "";
	if (location.protocol === 'https:')
		secureConnection = " secure=true"
	var player = '<media-stream-player hostname="' + window.location.hostname + '"'	+ secureConnection
				+ ' format="RTP_H264" compression="40" audio="0"'
				+ ' resolution="' + width + 'x' + height + '"'
				+ ' variant="basic" autoplay></media-stream-player>';
	$("#video").append(player);
}

// Audio status polling
var audioStatusInterval = null;

function updateAudioStatus() {
	$.ajax({
		type: "GET",
		url: 'status',
		dataType: 'json',
		cache: false,
		success: function(status) {
			if (status.audio && status.audio.status) {
				$('#audio-status').text(status.audio.status);

				// Update button states based on status
				if (status.audio.status.includes('Recording')) {
					$('#btn-record').prop('disabled', true).text('Recording...');
					$('#btn-playback').prop('disabled', true);
					$('#audio-status').removeClass('bg-secondary bg-success bg-danger').addClass('bg-warning');
				} else if (status.audio.status.includes('Playing')) {
					$('#btn-record').prop('disabled', true);
					$('#btn-playback').prop('disabled', true).text('Playing...');
					$('#audio-status').removeClass('bg-secondary bg-success bg-danger').addClass('bg-info');
				} else if (status.audio.status.includes('complete')) {
					$('#btn-record').prop('disabled', false).html('<i class="bi bi-mic-fill"></i> Record 10 Seconds');
					$('#btn-playback').prop('disabled', false).html('<i class="bi bi-play-fill"></i> Playback');
					$('#audio-status').removeClass('bg-secondary bg-warning bg-danger bg-info').addClass('bg-success');
				} else if (status.audio.status.includes('Failed')) {
					$('#btn-record').prop('disabled', false).html('<i class="bi bi-mic-fill"></i> Record 10 Seconds');
					$('#btn-playback').prop('disabled', true);
					$('#audio-status').removeClass('bg-secondary bg-success bg-warning bg-info').addClass('bg-danger');
				} else {
					$('#btn-record').prop('disabled', false).html('<i class="bi bi-mic-fill"></i> Record 10 Seconds');
					$('#btn-playback').prop('disabled', true);
					$('#audio-status').removeClass('bg-warning bg-success bg-danger bg-info').addClass('bg-secondary');
				}
			}
		}
	});
}

function recordAudio() {
	$('#audio-message').hide();
	$('#btn-record').prop('disabled', true).text('Starting...');

	$.ajax({
		type: "GET",
		url: 'audio_record',
		cache: false,
		success: function(response) {
			showMessage('success', 'Recording started! Speak into the microphone for 10 seconds.');
			// Start polling status
			if (audioStatusInterval) {
				clearInterval(audioStatusInterval);
			}
			audioStatusInterval = setInterval(updateAudioStatus, 500);

			// Stop polling after 12 seconds (10 sec recording + 2 sec buffer)
			setTimeout(function() {
				if (audioStatusInterval) {
					clearInterval(audioStatusInterval);
					audioStatusInterval = null;
				}
				updateAudioStatus(); // Final update
			}, 12000);
		},
		error: function(xhr) {
			showMessage('danger', 'Error: ' + (xhr.responseText || 'Failed to start recording'));
			$('#btn-record').prop('disabled', false).html('<i class="bi bi-mic-fill"></i> Record 10 Seconds');
		}
	});
}

function playbackAudio() {
	$('#audio-message').hide();
	$('#btn-playback').prop('disabled', true).text('Starting...');

	$.ajax({
		type: "GET",
		url: 'audio_playback',
		cache: false,
		success: function(response) {
			showMessage('success', 'Playing back recorded audio...');
			// Start polling status
			if (audioStatusInterval) {
				clearInterval(audioStatusInterval);
			}
			audioStatusInterval = setInterval(updateAudioStatus, 500);

			// Stop polling after 12 seconds (10 sec playback + 2 sec buffer)
			setTimeout(function() {
				if (audioStatusInterval) {
					clearInterval(audioStatusInterval);
					audioStatusInterval = null;
				}
				updateAudioStatus(); // Final update
			}, 12000);
		},
		error: function(xhr) {
			showMessage('danger', 'Error: ' + (xhr.responseText || 'Failed to start playback'));
			$('#btn-playback').prop('disabled', false).html('<i class="bi bi-play-fill"></i> Playback');
		}
	});
}

function showMessage(type, message) {
	$('#audio-message')
		.removeClass('alert-success alert-danger alert-info')
		.addClass('alert-' + type)
		.text(message)
		.show();
}

// Initial status check
$(document).ready(function() {
	updateAudioStatus();
});

</script>
</body>
</html>
