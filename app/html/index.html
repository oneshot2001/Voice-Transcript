<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transcriptions</title>
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<link rel="stylesheet" href="css/app.css">
	<script src="js/jquery-3.7.1.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/toast.js"></script>
</head>
<body>
<div class="d-flex" id="wrapper">
	<div class="bg-light border-right" id="sidebar-wrapper">
		<div class="sidebar-heading">&nbsp;</div>
		<div class="list-group list-group-flush">
			<a href="index.html" class="list-group-item list-group-item-action active">Transcriptions</a>
			<a href="config.html" class="list-group-item list-group-item-action">Configuration</a>
			<a href="mqtt.html" class="list-group-item list-group-item-action">MQTT</a>
			<a href="about.html" class="list-group-item list-group-item-action">About</a>
		</div>
	</div>

	<div id="page-content-wrapper" class="p-0">
		<div class="container-fluid">

			<!-- System Status -->
			<div class="row g-3 mb-3">
				<div class="col-12">
					<div class="card">
						<div class="card-header">
							<h5 class="card-title mb-0">System Status</h5>
						</div>
						<div class="card-body p-0">
							<table class="table mb-0">
								<tbody>
									<tr>
										<td class="ps-3 text-muted" style="width:220px">Microphone</td>
										<td><span id="status-input" class="badge bg-secondary state-badge">Checking...</span></td>
									</tr>
									<tr>
										<td class="ps-3 text-muted">Transcription Engine</td>
										<td><span id="status-engine" class="badge bg-secondary state-badge">Checking...</span></td>
									</tr>
									<tr>
										<td class="ps-3 text-muted">MQTT Connection</td>
										<td><span id="status-mqtt" class="badge bg-secondary state-badge">Checking...</span></td>
									</tr>
									<tr>
										<td class="ps-3 text-muted">Transcript Count</td>
										<td><span id="status-count" class="badge bg-info state-badge">0</span></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>

			<!-- Transcriptions -->
			<div class="row g-3">
				<div class="col-12">
					<div class="card">
						<div class="card-header d-flex justify-content-between align-items-center">
							<h5 class="card-title mb-0">Transcriptions</h5>
							<button id="clear-transcripts" class="btn btn-sm btn-outline-secondary" type="button">Clear</button>
						</div>
						<div class="card-body p-0">
							<div id="transcript-list">
								<div class="ps-3 pe-3 pt-3 pb-3 text-muted text-center">Listening for speech...</div>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>

	<div class="toast-container position-fixed top-0 end-0 p-3"></div>
</div>

<script>
let statusUpdateInterval = null;
let lastTranscriptTs = null;

$(document).ready(function() {
	$.ajax({
		type: "GET",
		url: 'app',
		dataType: 'json',
		cache: false,
		success: function(app) {
			document.title = app.manifest.acapPackageConf.setup.friendlyName;
			$('.sidebar-heading').text(app.manifest.acapPackageConf.setup.friendlyName);
		},
		error: function(response) {
			showToast('Failed to load application info: ' + response.statusText, 'danger');
		}
	});

	updateStatus();
	updateTranscripts();
	statusUpdateInterval = setInterval(function() {
		updateStatus();
		updateTranscripts();
	}, 500);
});

function updateStatus() {
	$.ajax({
		type: "GET",
		url: 'status',
		dataType: 'json',
		cache: false,
		success: function(status) {
			if (status.mqtt && status.mqtt.connected) {
				updateStatusItem('status-mqtt', 'ok', status.mqtt.status || 'Connected');
			} else {
				updateStatusItem('status-mqtt', 'error', status.mqtt?.status || 'Disconnected');
			}

			const inputStatus = status.input?.status || 'Unknown';
			if (status.input?.state) {
				updateStatusItem('status-input', 'ok', inputStatus);
			} else {
				updateStatusItem('status-input', 'error', inputStatus);
			}

			const engineState = status.stt?.state || 'idle';
			if (engineState === 'transcribing') {
				updateStatusItem('status-engine', 'info', 'Transcribing');
			} else if (engineState === 'listening') {
				updateStatusItem('status-engine', 'warning', 'Speech detected');
			} else if (engineState === 'error') {
				updateStatusItem('status-engine', 'error', 'Error');
			} else {
				updateStatusItem('status-engine', 'ok', 'Idle');
			}

			$('#status-count').text(status.stt?.count || 0);
		},
		error: function() {
			// Silently fail - don't spam console on network errors
		}
	});
}

function updateTranscripts() {
	$.ajax({
		type: "GET",
		url: 'transcripts',
		dataType: 'json',
		cache: false,
		success: function(entries) {
			if (!entries || entries.length === 0) {
				lastTranscriptTs = null;
				$('#transcript-list').html('<div class="ps-3 pe-3 pt-3 pb-3 text-muted text-center">No transcripts yet.</div>');
				return;
			}

			// Avoid re-rendering when nothing new has arrived
			if (lastTranscriptTs !== null && entries[0].ts === lastTranscriptTs) {
				return;
			}
			lastTranscriptTs = entries[0].ts;

			const html = entries.map(function(e) {
				const durationMs = Number.isFinite(e.duration_ms) ? e.duration_ms : 0;
				const durationLabel = durationMs > 0 ? (durationMs + ' ms') : '-';
				const ignoredBadge = e.ignored ? '<span class="badge bg-warning text-dark ms-2">Ignored</span>' : '';
				return '<div class="list-group-item">' +
					'<div class="d-flex justify-content-between align-items-start">' +
					'<div>' + escapeHtml(e.text) + ignoredBadge + '</div>' +
					'<span class="badge bg-secondary ms-2">' + escapeHtml(e.language) + '</span>' +
					'</div>' +
					'<small class="text-muted">' + formatTimestamp(e.ts) + ' | transcription: ' + escapeHtml(durationLabel) + '</small>' +
					'</div>';
			}).join('');

			$('#transcript-list').html(html);
		},
		error: function() {
			// Silently fail - don't spam console on network errors
		}
	});
}

function clearTranscripts() {
	$.ajax({
		type: 'DELETE',
		url: 'transcripts',
		success: function() {
			lastTranscriptTs = null;
			$('#transcript-list').html('<div class="ps-3 pe-3 pt-3 pb-3 text-muted text-center">No transcripts yet.</div>');
			$('#status-count').text('0');
			showToast('Transcript history cleared.', 'success');
		},
		error: function(xhr) {
			showToast('Failed to clear transcripts: ' + (xhr.responseText || 'Unknown error'), 'danger');
		}
	});
}

function updateStatusItem(elementId, statusClass, text) {
	const bgMap = { ok: 'bg-success', warning: 'bg-warning', error: 'bg-danger', info: 'bg-info', inactive: 'bg-secondary' };
	$('#' + elementId)
		.text(text)
		.removeClass('bg-success bg-warning bg-danger bg-info bg-secondary')
		.addClass(bgMap[statusClass] || 'bg-secondary');
}

function formatTimestamp(ts) {
	const d = new Date(ts);
	return d.toLocaleString();
}

function escapeHtml(text) {
	const map = {
		'&': '&amp;',
		'<': '&lt;',
		'>': '&gt;',
		'"': '&quot;',
		"'": '&#039;'
	};
	return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
}

$(window).on('beforeunload', function() {
	if (statusUpdateInterval) {
		clearInterval(statusUpdateInterval);
	}
});

$('#clear-transcripts').on('click', function() {
	clearTranscripts();
});
</script>
</body>
</html>
